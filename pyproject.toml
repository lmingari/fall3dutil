[project]
name            = "fall3dutil"
version         = "2.2.1"
authors         = [ { name="Leonardo Mingari", email="lmingari@gmail.com" } ]
description     = "Utilities for the FALL3D model"
readme          = "README.md"
license         = "MIT"
license-files   = ["LICENSE"]
requires-python = ">=3.7"
classifiers     = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    'requests',
    'cdsapi',
]

[project.urls]
repository = "https://github.com/lmingari/fall3dutil"

[project.optional-dependencies]
test = [
    "argparse"
]

[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"
